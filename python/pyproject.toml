[project]
name = "serverasmcp"
version = "0.4.4"
description = "MCP server that gives AI agents unrestricted root SSH access to unlimited Linux servers. Execute any command, deploy files, configure Cloudflare DNS, and self-heal deployments."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Arun", url = "https://github.com/akillv" },
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "deployment",
    "deploy",
    "ssh",
    "remote-execution",
    "server-management",
    "devops",
    "ai-agents",
    "codex",
    "claude",
    "cursor",
    "cloudflare",
    "dns",
    "systemd",
    "production",
    "self-healing",
    "root-access",
    "linux",
    "serverasmcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "asyncssh>=2.14.0,<2.22.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/akillv/serverASmcp"
Repository = "https://github.com/akillv/serverASmcp"
Issues = "https://github.com/akillv/serverASmcp/issues"
Documentation = "https://github.com/akillv/serverASmcp#readme"

[project.scripts]
serverasmcp = "mcp_deploy_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_deploy_server"]
