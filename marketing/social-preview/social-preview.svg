<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ServerAsMcp — one prompt to a live HTTPS deployment</title>
  <desc id="desc">A dark social preview showing an agent deploying a repository to a Linux server, with a browser loading a live HTTPS URL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="64" y="66" width="560" height="72" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="92" y="112" font-family="Inter, Arial, sans-serif" font-size="28" fill="#7dd3fc">ServerAsMcp</text>
  <text x="92" y="200" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="700" fill="#f8fafc">One prompt. One VPS.</text>
  <text x="92" y="257" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="700" fill="#f8fafc">Verified production.</text>
  <rect x="92" y="297" width="380" height="8" rx="4" fill="url(#accent)"/>
  <text x="92" y="356" font-family="Inter, Arial, sans-serif" font-size="26" fill="#cbd5e1">SSH · systemd · Cloudflare DNS</text>
  <text x="92" y="398" font-family="Inter, Arial, sans-serif" font-size="26" fill="#cbd5e1">Self-healing deployment loop</text>
  <rect x="684" y="98" width="532" height="336" rx="20" fill="#020617" stroke="#38bdf8" stroke-opacity="0.5"/>
  <circle cx="724" cy="136" r="9" fill="#f87171"/>
  <circle cx="754" cy="136" r="9" fill="#fbbf24"/>
  <circle cx="784" cy="136" r="9" fill="#34d399"/>
  <text x="724" y="196" font-family="monospace" font-size="22" fill="#e2e8f0">Deploy my repo to web-1</text>
  <text x="724" y="232" font-family="monospace" font-size="22" fill="#7dd3fc">and make it live at</text>
  <text x="724" y="268" font-family="monospace" font-size="22" fill="#7dd3fc">app.example.com</text>
  <text x="724" y="326" font-family="monospace" font-size="20" fill="#34d399">✓ service active</text>
  <text x="724" y="362" font-family="monospace" font-size="20" fill="#34d399">✓ localhost 200</text>
  <text x="724" y="398" font-family="monospace" font-size="20" fill="#34d399">✓ https://app.example.com 200</text>
  <rect x="684" y="474" width="532" height="86" rx="18" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.6"/>
  <text x="716" y="525" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Live in one agent prompt</text>
</svg>
